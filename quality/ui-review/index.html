<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI review · 渝游智策</title>
<style>body{margin:0;background:#dfe5df;font:13px system-ui}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:#233b36;color:white}select{padding:8px;border-radius:6px}iframe{display:block;border:0;margin:16px auto;width:100%;height:calc(100vh - 92px);background:#f6f5f1}label{display:flex;gap:8px;align-items:center}small{color:#c6d6cb}</style>
<header><strong>UI 检查 · 固定样例</strong><label>页面<select id="route"><option value="home">首页</option><option value="planning">行程</option><option value="draft">新行程对话</option><option value="explore">探索</option><option value="detail">详情</option><option value="trips">已保存</option><option value="history">历史</option><option value="profile">档案</option><option value="guest-chat">游客</option><option value="auth">登录</option><option value="admin">管理</option></select></label><label>宽度<select id="width"><option value="100%">桌面</option><option value="768px">平板 768</option><option value="390px">手机 390</option><option value="320px">窄屏 320</option></select></label><small>固定样例 · 行程确认仅使用本地测试回执</small></header><iframe id="preview" title="真实页面渲染样例" src="./frame.html?view=home"></iframe>
<script type="module">const frame=document.querySelector('#preview');document.querySelector('#route').onchange=e=>frame.src=`./frame.html?view=${e.target.value}`;document.querySelector('#width').onchange=e=>frame.style.width=e.target.value;</script></html>

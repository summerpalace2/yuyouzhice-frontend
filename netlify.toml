[build]
  # The production site is the current static ESM application copied from
  # ../app. It must be served as-is so the deployed UI stays identical to
  # the locally verified UI rather than rebuilding the retired Vue snapshot.
  publish = "web"

# Keep browser requests same-origin while the BFF remains responsible for
# sessions, CSRF validation and Java Core orchestration.
[[redirects]]
  from = "/api/*"
  to = "https://ggy.zeabur.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "https://ggy.zeabur.app/images/:splat"
  status = 200
  force = true

# Keep static-app deep links on the application entry point after direct refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
